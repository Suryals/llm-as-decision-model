[project]
name = "llm-as-decision-model"
version = "0.1.0"
description = "Can a local LLM, read as a decision model, replace a dedicated System One model (TypeSafe Jev)?"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
    "scikit-learn>=1.9.1",
]
